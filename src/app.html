<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph defaults; pages override title, description, and url. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Melovian" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Melovian home screen" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og.png" />
    <meta name="twitter:image:alt" content="Melovian home screen" />

    <!-- Icons and theme -->
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/logo-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/favicon-192.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="%sveltekit.assets%/sitemap.xml" />

    <!-- Set the theme class before first paint to avoid a flash. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('melovian-theme')
          var mode = stored ? JSON.parse(stored) : 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
