version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      svelte:
        patterns:
          - 'svelte*'
          - '@sveltejs/*'
          - 'svelte-*'
      vite:
        patterns:
          - 'vite*'
          - '@vitejs/*'
      tailwind:
        patterns:
          - 'tailwind*'
          - '@tailwindcss/*'
      lint:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - 'typescript-eslint'
          - '*eslint*'
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
